<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мой Python-блог{% endblock %}</title>
    <link rel="alternate" type="application/rss+xml" title="RSS" href="/feed">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <!-- 🌓 CSS-переменные для темы -->
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #212529;
            --card-bg: #f8f9fa;
            --link-color: #FFD573;
            --border-color: #dee2e6;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --link-color: #6ea8fe;
            --border-color: #333333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .list-group-item {
            background-color: var(--card-bg) !important;
            color: var(--text-color) !important;
            border-color: var(--border-color) !important;
        }
        a { color: var(--link-color) !important; }
        .text-muted { color: #6c757d !important; }
        [data-theme="dark"] .text-muted { color: #adb5bd !important; }
        [data-theme="dark"] .bg-light { background-color: #1a1a1a !important; }
        [data-theme="dark"] .alert-info { background-color: #1c2a3a !important; color: #d1e7dd !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">🐍 Python-блог</a>

            <div class="d-flex align-items-center gap-2">
                <form action="/search" method="GET" class="d-flex" role="search">
                    <input class="form-control me-2 form-control-sm" type="search"
                           placeholder="Поиск..." name="q" value="{{ query or '' }}"
                           aria-label="Search" style="max-width: 180px;">
                    <button class="btn btn-outline-light btn-sm" type="submit">🔍</button>
                </form>

                <!-- 🌓 Кнопка переключения темы -->
                <button id="theme-toggle" class="btn btn-outline-light btn-sm" aria-label="Переключить тему">🌓</button>

                {% if session.logged_in %}
                    <a href="/create" class="btn btn-outline-light btn-sm">➕ Новый пост</a>
                    <a href="/logout" class="btn btn-outline-danger btn-sm">🚪 Выйти</a>
                {% else %}
                    <a href="/login" class="btn btn-outline-light btn-sm">🔐 Войти</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>

    <!-- 🌓 Логика переключения темы -->
    <script>
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        // Применяем сохранённую тему или системные настройки
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }

        // Обработчик кнопки
        document.getElementById('theme-toggle').addEventListener('click', () => {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    </script>
</body>
</html>
