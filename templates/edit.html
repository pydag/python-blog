{% extends "base.html" %}
{% block title %}Редактирование: {{ title }}{% endblock %}
{% block content %}
<h2>✏️ Редактирование поста</h2>
<form action="/post/{{ slug }}/edit" method="POST" class="mt-3">
    <div class="mb-3">
        <label for="title" class="form-label">Заголовок</label>
        <input type="text" class="form-control" id="title" name="title" value="{{ title }}" required>
    </div>
    <div class="mb-3">
        <label for="tags" class="form-label">Теги (через запятую)</label>
        <input type="text" class="form-control" id="tags" name="tags" value="{{ tags }}" placeholder="python, flask, обучение">
    </div>
    <div class="mb-3">
        <label for="content" class="form-label">Текст поста (Markdown)</label>
        <textarea class="form-control" id="content" name="content" rows="12" required>{{ content }}</textarea>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">💾 Сохранить изменения</button>
        <a href="/post/{{ slug }}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
